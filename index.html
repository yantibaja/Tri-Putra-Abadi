<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Koperasi Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-slate-900 to-black min-h-screen text-white flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8">
        
        <!-- HEADER / PILIH HALAMAN -->
        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Koperasi Digital</h1>
            <div class="space-x-2">
                <button onclick="switchTab('login')" id="btn-login" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white transition">Login</button>
                <button onclick="switchTab('register')" id="btn-register" class="px-4 py-2 rounded-xl text-sm font-semibold bg-white/10 text-slate-300 hover:bg-white/20 transition">Daftar Nasabah</button>
            </div>
        </div>

        <!-- FORM LOGIN -->
        <div id="form-login-container">
            <h2 class="text-2xl font-extrabold mb-2">Login Nasabah</h2>
            <p class="text-slate-400 text-sm mb-6">Masuk menggunakan NIK dan password terdaftar</p>
            
            <div id="login-alert" class="hidden mb-4 p-3 bg-rose-500/20 border border-rose-500 text-rose-200 text-sm rounded-xl text-center"></div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">NIK (16 Digit)</label>
                    <input type="text" id="login-nik" required maxlength="16" placeholder="Masukkan 16 digit NIK" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none tracking-widest text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none text-white">
                </div>
                <button type="submit" id="btn-login-submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 font-bold rounded-xl shadow-lg transition">Masuk Aplikasi</button>
            </form>
        </div>

        <!-- FORM REGISTER NASABAH -->
        <div id="form-register-container" class="hidden">
            <h2 class="text-2xl font-extrabold mb-2">Pendaftaran Nasabah</h2>
            <p class="text-slate-400 text-sm mb-6">Lengkapi data diri sesuai KTP dengan benar</p>

            <form onsubmit="handleRegister(event)" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <div>
                    <label class="block text-sm font-medium mb-1">Pilih Koperasi Tujuan *</label>
                    <select id="reg-koperasi" required class="w-full px-4 py-3 bg-slate-900 border border-white/20 rounded-xl outline-none text-white">
                        <option value="">-- Memuat Data Koperasi --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Lengkap Sesuai KTP *</label>
                    <input type="text" id="reg-nama" required placeholder="Nama lengkap" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">NIK (Wajib 16 Digit) *</label>
                    <input type="text" id="reg-nik" required maxlength="16" placeholder="16 digit NIK" oninput="checkNik(this)" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none tracking-widest text-white">
                    <p id="nik-warning" class="text-rose-400 text-xs mt-1 hidden">NIK harus tepat 16 digit angka!</p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Alamat Lengkap *</label>
                    <textarea id="reg-alamat" required rows="2" placeholder="Jalan, RT/RW, Kelurahan, Kecamatan" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Nomor HP/WA Aktif *</label>
                    <input type="tel" id="reg-hp" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium mb-1">Jenis Penghasilan *</label>
                        <select id="reg-jenis-penghasilan" class="w-full px-4 py-3 bg-slate-900 border border-white/20 rounded-xl outline-none text-white">
                            <option value="Punya usaha">Punya Usaha</option>
                            <option value="Kerja">Kerja / Karyawan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Detail Usaha/Kerja *</label>
                        <input type="text" id="reg-detail-penghasilan" required placeholder="Contoh: Toko Sembako" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Alamat Usaha atau Tempat Kerja *</label>
                    <input type="text" id="reg-alamat-usaha" required placeholder="Alamat lokasi usaha/kerja" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white">
                </div>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div>
                        <label class="block text-sm font-medium mb-1">Foto KTP *</label>
                        <input type="file" id="reg-file-ktp" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Foto Bersama KTP *</label>
                        <input type="file" id="reg-file-diri" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password Akun *</label>
                    <input type="password" id="reg-password" required placeholder="Buat password rahasia" class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl outline-none text-white">
                </div>
                <button type="submit" id="btn-reg-submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 font-bold rounded-xl shadow-lg transition">Daftar Sekarang</button>
            </form>
        </div>

    </div>

    <!-- MODAL SUKSES KEKINIAN -->
    <div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden">
        <div class="bg-white text-slate-900 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-scale">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🎉</div>
            <h3 class="text-xl font-bold mb-2">Pendaftaran Berhasil!</h3>
            <p class="text-slate-600 text-sm mb-4">Akun Anda berhasil dibuat. Mengalihkan ke halaman login...</p>
        </div>
    </div>

    <!-- SKrip Logika Supabase & Interaksi -->
    <script>
        // ISI DENGAN URL & ANON KEY SUPABASE ANDA
        const SUPABASE_URL = 'https://cwkbyeyjceaqqxovuhyf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3a2J5ZXlqY2VhcXF4b3Z1aHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDA2MTIsImV4cCI6MjEwNDg3NjYxMn0.hOf0sap6LX6PajxHjRDG4PfeqBFCv738eQ9cFfJdOdE';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Pindah Tab Login / Register
        function switchTab(tab) {
            const loginContainer = document.getElementById('form-login-container');
            const regContainer = document.getElementById('form-register-container');
            const btnLogin = document.getElementById('btn-login');
            const btnReg = document.getElementById('btn-register');

            if(tab === 'login') {
                loginContainer.classList.remove('hidden');
                regContainer.classList.add('hidden');
                btnLogin.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white transition";
                btnReg.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-white/10 text-slate-300 hover:bg-white/20 transition";
            } else {
                loginContainer.classList.add('hidden');
                regContainer.classList.remove('hidden');
                btnReg.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white transition";
                btnLogin.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-white/10 text-slate-300 hover:bg-white/20 transition";
                loadKoperasiList();
            }
        }

        // Ambil Data Koperasi untuk Dropdown
        async function loadKoperasiList() {
            const select = document.getElementById('reg-koperasi');
            const { data, error } = await _supabase.from('koperasi').select('id, nama_koperasi');
            if(data && data.length > 0) {
                select.innerHTML = '<option value="">-- Pilih Koperasi --</option>';
                data.forEach(kop => {
                    select.innerHTML += `<option value="${kop.id}">${kop.nama_koperasi}</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Belum ada koperasi terdaftar</option>';
            }
        }

        // Validasi NIK 16 Digit
        function checkNik(input) {
            const warning = document.getElementById('nik-warning');
            if(input.value.length !== 16) {
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }
        }

        // Proses Login
        async function handleLogin(e) {
            e.preventDefault();
            const nik = document.getElementById('login-nik').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            
            alertBox.classList.add('hidden');
            const emailDummy = `${nik}@nasabah.koperasi.com`;

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: emailDummy,
                    password: password
                });
                if(error) throw error;
                alert('Login Berhasil! Selamat datang.');
                window.location.reload();
            } catch(err) {
                alertBox.textContent = 'Gagal Login: Periksa kembali NIK dan Password.';
                alertBox.classList.remove('hidden');
            }
        }

        // Proses Register Nasabah
        async function handleRegister(e) {
            e.preventDefault();
            const nik = document.getElementById('reg-nik').value;
            if(nik.length !== 16) {
                alert('NIK harus 16 digit!');
                return;
            }

            const btnSubmit = document.getElementById('btn-reg-submit');
            btnSubmit.textContent = 'Sedang Mengunggah & Memproses...';
            btnSubmit.disabled = true;

            try {
                const fileKtp = document.getElementById('reg-file-ktp').files[0];
                const fileDiri = document.getElementById('reg-file-diri').files[0];
                const koperasiId = document.getElementById('reg-koperasi').value;
                const namaLengkap = document.getElementById('reg-nama').value;
                const alamat = document.getElementById('reg-alamat').value;
                const noHp = document.getElementById('reg-hp').value;
                const jenisPenghasilan = document.getElementById('reg-jenis-penghasilan').value;
                const detailPenghasilan = document.getElementById('reg-detail-penghasilan').value;
                const alamatUsaha = document.getElementById('reg-alamat-usaha').value;
                const password = document.getElementById('reg-password').value;

                // 1. Upload File ke Storage Supabase
                const fileNameKtp = `ktp_${nik}_${Date.now()}.${fileKtp.name.split('.').pop()}`;
                const fileNameDiri = `diri_${nik}_${Date.now()}.${fileDiri.name.split('.').pop()}`;

                await _supabase.storage.from('koperasi-files').upload(fileNameKtp, fileKtp);
                await _supabase.storage.from('koperasi-files').upload(fileNameDiri, fileDiri);

                const { data: urlKtp } = _supabase.storage.from('koperasi-files').getPublicUrl(fileNameKtp);
                const { data: urlDiri } = _supabase.storage.from('koperasi-files').getPublicUrl(fileNameDiri);

                // 2. Daftar ke Auth Supabase
                const emailDummy = `${nik}@nasabah.koperasi.com`;
                const { data: authData, error: authError } = await _supabase.auth.signUp({
                    email: emailDummy,
                    password: password,
                    options: {
                        data: {
                            nama_lengkap: namaLengkap,
                            role: 'member',
                            koperasi_id: koperasiId
                        }
                    }
                });

                if(authError) throw authError;

                // 3. Simpan Detail ke Profiles
                const userId = authData.user?.id;
                if(userId) {
                    await _supabase.from('profiles').upsert({
                        id: userId,
                        nama_lengkap: namaLengkap,
                        role: 'member',
                        koperasi_id: koperasiId,
                        alamat_lengkap: alamat,
                        no_hp: noHp,
                        nik: nik,
                        jenis_penghasilan: jenisPenghasilan,
                        detail_penghasilan: detailPenghasilan,
                        alamat_usaha_kerja: alamatUsaha,
                        foto_ktp_url: urlKtp.publicUrl,
                        foto_diri_ktp_url: urlDiri.publicUrl
                    });
                }

                // Tampilkan Modal Sukses
                document.getElementById('success-modal').classList.remove('hidden');
                setTimeout(() => {
                    window.location.reload();
                }, 2500);

            } catch(err) {
                alert('Pendaftaran Gagal: ' + err.message);
                btnSubmit.textContent = 'Daftar Sekarang';
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>

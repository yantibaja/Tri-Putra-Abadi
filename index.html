<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Koperasi Terpadu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 min-h-screen text-white flex flex-col items-center justify-start p-3 sm:p-6">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-5 mb-10">
        
        <!-- NAVIGASI UTAMA (BELUM LOGIN) -->
        <div id="nav-tabs" class="flex justify-between mb-6 border-b border-slate-800 pb-3 gap-1">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition">Login</button>
            <button onclick="switchTab('owner')" id="tab-owner" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition">Daftar Koperasi</button>
            <button onclick="switchTab('register')" id="tab-reg" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition">Nasabah</button>
        </div>

        <!-- AREA KONTEN DINAMIS -->
        <div id="app-container">
            <!-- PANE LOGIN -->
            <div id="panel-login">
                <h2 class="text-xl font-bold mb-1">Login Sistem</h2>
                <p class="text-slate-400 text-xs mb-4">Masukkan Email atau NIK terdaftar</p>
                <div id="login-alert" class="hidden mb-3 p-2 bg-rose-500/20 border border-rose-500 text-rose-200 text-xs rounded-lg text-center"></div>
                <form onsubmit="handleLogin(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium mb-1">Email / NIK</label>
                        <input type="text" id="login-email" required placeholder="NIK atau Email" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs outline-none focus:border-indigo-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs outline-none focus:border-indigo-500 text-white">
                    </div>
                    <button type="submit" id="btn-login-sub" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-bold rounded-xl transition">Masuk</button>
                </form>
            </div>

            <!-- PANE PENDAFTARAN KOPERASI (OWNER) -->
            <div id="panel-owner" class="hidden">
                <h2 class="text-xl font-bold mb-1">Daftar Koperasi</h2>
                <p class="text-slate-400 text-xs mb-4">Khusus Pemilik Badan Usaha</p>
                <form onsubmit="handleRegisterOwner(event)" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1 text-xs">
                    <div><label class="block font-medium mb-1">Nama Pemilik *</label><input type="text" id="owner-nama" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div><label class="block font-medium mb-1">NIK Pemilik (16 Digit) *</label><input type="text" id="owner-nik" required maxlength="16" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white tracking-widest"></div>
                    <div><label class="block font-medium mb-1">Nama Koperasi *</label><input type="text" id="owner-nama-kop" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div><label class="block font-medium mb-1">Alamat Kantor *</label><textarea id="owner-alamat" required rows="2" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></textarea></div>
                    <div><label class="block font-medium mb-1">Logo Koperasi *</label><input type="file" id="owner-logo" accept="image/*" required class="w-full text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white"></div>
                    <div><label class="block font-medium mb-1">Email Admin *</label><input type="email" id="owner-email" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div><label class="block font-medium mb-1">Password *</label><input type="password" id="owner-pass" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <button type="submit" id="btn-owner-sub" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition">Daftar Koperasi</button>
                </form>
            </div>

            <!-- PANE PENDAFTARAN NASABAH -->
            <div id="panel-reg" class="hidden">
                <h2 class="text-xl font-bold mb-1">Daftar Nasabah</h2>
                <p class="text-slate-400 text-xs mb-4">Lengkapi data diri sesuai KTP</p>
                <form onsubmit="handleRegisterNasabah(event)" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1 text-xs">
                    <div>
                        <label class="block font-medium mb-1">Pilih Koperasi *</label>
                        <select id="reg-kop-select" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"><option value="">Memuat data...</option></select>
                    </div>
                    <div><label class="block font-medium mb-1">Nama Lengkap *</label><input type="text" id="reg-nama" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div><label class="block font-medium mb-1">NIK (16 Digit) *</label><input type="text" id="reg-nik" required maxlength="16" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white tracking-widest"></div>
                    <div><label class="block font-medium mb-1">Alamat Lengkap *</label><textarea id="reg-alamat" required rows="2" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></textarea></div>
                    <div><label class="block font-medium mb-1">Nomor HP/WA *</label><input type="tel" id="reg-hp" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-medium mb-1">Jenis Penghasilan *</label>
                            <select id="reg-penghasilan" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"><option value="Punya usaha">Punya Usaha</option><option value="Kerja">Kerja</option></select>
                        </div>
                        <div><label class="block font-medium mb-1">Detail Usaha/Kerja *</label><input type="text" id="reg-detail-penghasilan" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    </div>
                    <div><label class="block font-medium mb-1">Alamat Usaha/Kerja *</label><input type="text" id="reg-alamat-usaha" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block font-medium mb-1">Foto KTP *</label><input type="file" id="reg-ktp" accept="image/*" required class="w-full text-[10px] text-slate-400 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-600 file:text-white"></div>
                        <div><label class="block font-medium mb-1">Foto & KTP *</label><input type="file" id="reg-diri" accept="image/*" required class="w-full text-[10px] text-slate-400 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-600 file:text-white"></div>
                    </div>
                    <div><label class="block font-medium mb-1">Password Akun *</label><input type="password" id="reg-pass" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                    <button type="submit" id="btn-reg-sub" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition">Daftar Nasabah</button>
                </form>
            </div>
        </div>

        <!-- PANEL DASHBOARD UTAMA (SETELAH LOGIN) -->
        <div id="panel-dashboard" class="hidden">
            <!-- Navigasi Dashboard per Role -->
            <div id="role-nav-container" class="flex flex-wrap gap-1 mb-5 border-b border-slate-800 pb-3 text-xs"></div>
            <!-- Konten Dinamis Dashboard -->
            <div id="dashboard-content"></div>
        </div>

    </div>

    <!-- SCRIPT UTAMA KOPERASI -->
    <script>
        const SUPABASE_URL = 'https://cwkbyeyjceaqqxovuhyf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3a2J5ZXlqY2VhcXF4b3Z1aHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDA2MTIsImV4cCI6MjEwNDg3NjYxMn0.hOf0sap6LX6PajxHjRDG4PfeqBFCv738eQ9cFfJdOdE';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    await initUserSession(session.user);
                }
            } catch (err) {
                console.error(err);
            }
        });

        function switchTab(tab) {
            ['panel-login', 'panel-owner', 'panel-reg'].forEach(id => document.getElementById(id).classList.add('hidden'));
            ['tab-login', 'tab-owner', 'tab-reg'].forEach(id => document.getElementById(id).className = "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition");

            if (tab === 'login') {
                document.getElementById('panel-login').classList.remove('hidden');
                document.getElementById('tab-login').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition";
            } else if (tab === 'owner') {
                document.getElementById('panel-owner').classList.remove('hidden');
                document.getElementById('tab-owner').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition";
            } else if (tab === 'register') {
                document.getElementById('panel-reg').classList.remove('hidden');
                document.getElementById('tab-reg').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition";
                loadKoperasiList();
            }
        }

        async function initUserSession(user) {
            currentUser = user;
            let { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
            currentProfile = profile || { role: user.user_metadata?.role || 'member', nama_lengkap: user.user_metadata?.nama_lengkap || 'Pengguna' };

            document.getElementById('nav-tabs').classList.add('hidden');
            ['panel-login', 'panel-owner', 'panel-reg'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('panel-dashboard').classList.remove('hidden');

            renderRoleNavigation();
        }

        function renderRoleNavigation() {
            const navContainer = document.getElementById('role-nav-container');
            navContainer.innerHTML = '';
            let role = currentProfile.role;

            if (role === 'owner') {
                navContainer.innerHTML = `
                    <button onclick="loadOwnerView('dashboard')" class="px-3 py-1.5 bg-indigo-600 rounded-lg font-bold text-white">Dashboard</button>
                    <button onclick="loadOwnerView('approve')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-slate-300">Approve Pinjaman</button>
                    <button onclick="loadOwnerView('nasabah')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-slate-300">Daftar Nasabah</button>
                    <button onclick="loadOwnerView('settings')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-slate-300">Pengaturan</button>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 text-rose-400 rounded-lg ml-auto">Keluar</button>
                `;
                loadOwnerView('dashboard');
            } else if (role === 'penagih' || role === 'collector') {
                navContainer.innerHTML = `
                    <button onclick="loadCollectorView()" class="px-3 py-1.5 bg-indigo-600 rounded-lg font-bold text-white">Penagihan / Jatuh Tempo</button>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 text-rose-400 rounded-lg ml-auto">Keluar</button>
                `;
                loadCollectorView();
            } else {
                // Member / Nasabah
                navContainer.innerHTML = `
                    <button onclick="loadMemberView('dashboard')" class="px-3 py-1.5 bg-indigo-600 rounded-lg font-bold text-white">Dashboard</button>
                    <button onclick="loadMemberView('pinjaman')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-slate-300">Ajukan Pinjaman</button>
                    <button onclick="loadMemberView('settings')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-slate-300">Pengaturan</button>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 text-rose-400 rounded-lg ml-auto">Keluar</button>
                `;
                loadMemberView('dashboard');
            }
        }

        // ==================== DASHBOARD & FITUR OWNER / ADMIN ====================
        async function loadOwnerView(view) {
            const content = document.getElementById('dashboard-content');
            
            if (view === 'dashboard') {
                content.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Memuat statistik laporan keuangan...</div>`;
                
                // Ambil data statistik dari supabase
                let { data: nasabah } = await _supabase.from('profiles').select('*').eq('koperasi_id', currentProfile.koperasi_id).eq('role', 'member');
                let { data: pinjaman } = await _supabase.from('pinjaman').select('*').eq('koperasi_id', currentProfile.koperasi_id);

                const totalNasabah = nasabah ? nasabah.length : 0;
                let totalDanaKeluar = 0;
                let totalDanaMasuk = 0;
                let peminjamAktif = 0;
                let nasabahMacet = 0;
                let totalPemasukanFee = 0;

                if (pinjaman) {
                    pinjaman.forEach(p => {
                        if (p.status === 'disetujui' || p.status === 'aktif') {
                            totalDanaKeluar += Number(p.nominal || 0);
                            peminjamAktif++;
                        }
                        if (p.status === 'macet') {
                            nasabahMacet++;
                        }
                        totalDanaMasuk += Number(p.total_sudah_dibayar || 0);
                        totalPemasukanFee += Number(p.total_fee_diterima || 0);
                    });
                }

                content.innerHTML = `
                    <div class="mb-4">
                        <h2 class="text-lg font-bold">Dashboard Koperasi</h2>
                        <p class="text-xs text-slate-400">Ringkasan operasional dan keuangan koperasi Anda.</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Total Nasabah</p><p class="text-lg font-bold text-indigo-400 mt-1">${totalNasabah}</p></div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Total Dana Keluar</p><p class="text-lg font-bold text-emerald-400 mt-1">Rp ${totalDanaKeluar.toLocaleString('id-ID')}</p></div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Total Dana Masuk</p><p class="text-lg font-bold text-sky-400 mt-1">Rp ${totalDanaMasuk.toLocaleString('id-ID')}</p></div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Peminjam Aktif</p><p class="text-lg font-bold text-amber-400 mt-1">${peminjamAktif}</p></div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Nasabah Macet</p><p class="text-lg font-bold text-rose-400 mt-1">${nasabahMacet}</p></div>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><p class="text-slate-400">Total Pemasukan Fee</p><p class="text-lg font-bold text-purple-400 mt-1">Rp ${totalPemasukanFee.toLocaleString('id-ID')}</p></div>
                    </div>
                `;
            } else if (view === 'approve') {
                content.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Memuat daftar pengajuan pinjaman...</div>`;
                let { data: pengajuan } = await _supabase.from('pinjaman').select('*, profiles(nama_lengkap, no_hp, nik)').eq('koperasi_id', currentProfile.koperasi_id).eq('status', 'pending');

                let html = `<h2 class="text-lg font-bold mb-3">Persetujuan Pinjaman Nasabah</h2>`;
                if (!pengajuan || pengajuan.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-6">Tidak ada pengajuan pinjaman baru saat ini.</p>`;
                } else {
                    html += `<div class="space-y-3 text-xs">`;
                    pengajuan.forEach(p => {
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                                <p><strong>Nama:</strong> ${p.profiles?.nama_lengkap || '-'}</p>
                                <p><strong>Nominal:</strong> Rp ${Number(p.nominal).toLocaleString('id-ID')} (${p.jenis_tenor} - ${p.lama_tenor}x)</p>
                                <p><strong>Angsuran/Tempo:</strong> Rp ${Number(p.nominal_cicilan_per_tempo).toLocaleString('id-ID')} per ${p.jenis_tenor}</p>
                                <div class="flex gap-2 mt-2 pt-2 border-t border-slate-800">
                                    <button onclick="approvePinjaman('${p.id}', 'disetujui')" class="flex-1 py-1.5 bg-emerald-600 font-bold rounded-lg">Setujui</button>
                                    <button onclick="approvePinjaman('${p.id}', 'ditolak')" class="flex-1 py-1.5 bg-rose-600 font-bold rounded-lg">Tolak</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                content.innerHTML = html;
            } else if (view === 'nasabah') {
                content.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Memuat data nasabah...</div>`;
                let { data: list } = await _supabase.from('profiles').select('*').eq('koperasi_id', currentProfile.koperasi_id).eq('role', 'member');
                
                let html = `<h2 class="text-lg font-bold mb-3">Daftar Lengkap Nasabah</h2>`;
                if (!list || list.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-6">Belum ada nasabah terdaftar.</p>`;
                } else {
                    html += `<div class="space-y-3 text-xs max-h-[60vh] overflow-y-auto pr-1">`;
                    list.forEach(n => {
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                                <p><strong>Nama:</strong> ${n.nama_lengkap}</p>
                                <p><strong>NIK:</strong> ${n.nik}</p>
                                <p><strong>No HP:</strong> ${n.no_hp || '-'}</p>
                                <p><strong>Alamat:</strong> ${n.alamat_lengkap || '-'}</p>
                                <div class="flex gap-2 mt-2 pt-2 border-t border-slate-800">
                                    <a href="${n.foto_ktp_url}" target="_blank" class="px-2 py-1 bg-slate-800 rounded text-center flex-1">Foto KTP</a>
                                    <a href="${n.foto_diri_ktp_url}" target="_blank" class="px-2 py-1 bg-slate-800 rounded text-center flex-1">Foto & KTP</a>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                content.innerHTML = html;
            } else if (view === 'settings') {
                // Ambil data pengaturan koperasi saat ini
                let { data: kop } = await _supabase.from('koperasi').select('*').eq('id', currentProfile.koperasi_id).single();
                
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-3">Pengaturan Koperasi</h2>
                    <form onsubmit="updateKoperasiSettings(event)" class="space-y-3 text-xs">
                        <div><label class="block font-medium mb-1">Nama Koperasi</label><input type="text" id="set-nama-kop" value="${kop?.nama_koperasi || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div><label class="block font-medium mb-1">Ganti Logo Koperasi</label><input type="file" id="set-logo" accept="image/*" class="w-full text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium mb-1">Tipe Suku Fee</label>
                                <select id="set-tipe-fee" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white">
                                    <option value="persen" ${kop?.tipe_fee === 'persen' ? 'selected' : ''}>Persen (%)</option>
                                    <option value="nominal" ${kop?.tipe_fee === 'nominal' ? 'selected' : ''}>Nominal Tetap (Rp)</option>
                                </select>
                            </div>
                            <div><label class="block font-medium mb-1">Besaran Fee</label><input type="number" id="set-besar-fee" value="${kop?.besar_fee || 10}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Aturan Hari Minggu / Libur</label>
                            <select id="set-hari-libur" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white">
                                <option value="otomatis_libur" ${kop?.hari_libur !== 'tetap_jalan' ? 'selected' : ''}>Otomatis Libur (Geser ke Hari Kerja)</option>
                                <option value="tetap_jalan" ${kop?.hari_libur === 'tetap_jalan' ? 'selected' : ''}>Tetap Jalan Terus</option>
                            </select>
                        </div>
                        <div><label class="block font-medium mb-1">Atur Denda Keterlambatan (Per Hari/Tempo)</label><input type="number" id="set-denda" value="${kop?.denda_keterlambatan || 5000}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <button type="submit" class="w-full py-2.5 bg-indigo-600 font-bold rounded-xl mt-2">Simpan Pengaturan</button>
                    </form>
                `;
            }
        }

        // ==================== AKSES PENAGIH / DEBT COLLECTOR ====================
        async function loadCollectorView() {
            const content = document.getElementById('dashboard-content');
            content.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Memuat daftar jatuh tempo...</div>`;

            let { data: list } = await _supabase.from('penagihan_jatuh_tempo').select('*, profiles(nama_lengkap, no_hp, alamat_lengkap)').eq('koperasi_id', currentProfile.koperasi_id).eq('status', 'belum_bayar');

            let html = `
                <h2 class="text-lg font-bold mb-1">Daftar Penagihan Jatuh Tempo</h2>
                <p class="text-xs text-slate-400 mb-4">Daftar nasabah yang wajib ditagih hari ini.</p>
            `;

            if (!list || list.length === 0) {
                html += `<p class="text-xs text-slate-400 text-center py-6">Tidak ada tagihan jatuh tempo saat ini.</p>`;
            } else {
                html += `<div class="space-y-3 text-xs max-h-[60vh] overflow-y-auto pr-1">`;
                list.forEach(item => {
                    html += `
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                            <p><strong>Nasabah:</strong> ${item.profiles?.nama_lengkap}</p>
                            <p><strong>Tanggal Jatuh Tempo:</strong> ${item.tanggal_jatuh_tempo}</p>
                            <p><strong>Total Angsuran:</strong> Rp ${Number(item.total_angsuran).toLocaleString('id-ID')}</p>
                            
                            <div>
                                <label class="block text-slate-400 mb-1">Alasan Terlambat (Jika ada):</label>
                                <input type="text" id="alasan_${item.id}" placeholder="Kendala nasabah..." class="w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white">
                            </div>

                            <div>
                                <label class="block text-slate-400 mb-1">Upload Bukti / Foto Bersama Nasabah *</label>
                                <input type="file" id="bukti_${item.id}" accept="image/*" class="w-full text-[10px] text-slate-400 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-600 file:text-white">
                            </div>

                            <button onclick="submitPenagihan('${item.id}', '${item.pinjaman_id}', '${item.total_angsuran}')" class="w-full py-2 bg-emerald-600 font-bold rounded-lg mt-1">Konfirmasi Pembayaran Diterima</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            content.innerHTML = html;
        }

        async function submitPenagihan(id, pinjamanId, nominal) {
            const alasan = document.getElementById(`alasan_${id}`).value;
            const fileInput = document.getElementById(`bukti_${id}`).files[0];
            
            if (!fileInput) {
                alert('Harap upload foto bukti pembayaran / foto bersama nasabah terlebih dahulu!');
                return;
            }

            try {
                const fileName = `penagihan_${id}_${Date.now()}.${fileInput.name.split('.').pop()}`;
                await _supabase.storage.from('koperasi-files').upload(fileName, fileInput);
                const { data: urlData } = _supabase.storage.from('koperasi-files').getPublicUrl(fileName);

                // Update status penagihan
                await _supabase.from('penagihan_jatuh_tempo').update({
                    status: 'lunas',
                    alasan_terlambat: alasan,
                    foto_bukti_url: urlData.publicUrl
                }).eq('id', id);

                // Update total dibayar di pinjaman
                let { data: pin } = await _supabase.from('pinjaman').select('total_sudah_dibayar').eq('id', pinjamanId).single();
                let currentBayar = Number(pin?.total_sudah_dibayar || 0) + Number(nominal);
                await _supabase.from('pinjaman').update({ total_sudah_dibayar: currentBayar }).eq('id', pinjamanId);

                alert('Data penagihan berhasil disimpan!');
                loadCollectorView();
            } catch (err) {
                alert('Gagal menyimpan: ' + err.message);
            }
        }

        // ==================== DASHBOARD & FITUR NASABAH / MEMBER ====================
        async function loadMemberView(view) {
            const content = document.getElementById('dashboard-content');

            if (view === 'dashboard') {
                content.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Memuat profil keuangan...</div>`;
                
                let { data: pinjList } = await _supabase.from('pinjaman').select('*').eq('nasabah_id', currentUser.id);
                let totalSimpanan = currentProfile.total_simpanan || 0;
                let totalAngsuranBerjalan = 0;
                let totalAngsuranLunas = 0;

                if (pinjList) {
                    pinjList.forEach(p => {
                        if (p.status === 'aktif' || p.status === 'disetujui') {
                            totalAngsuranBerjalan += Number(p.total_cicilan_per_tempo || 0);
                        } else if (p.status === 'lunas') {
                            totalAngsuranLunas += Number(p.nominal || 0);
                        }
                    });
                }

                content.innerHTML = `
                    <div class="mb-4">
                        <h2 class="text-lg font-bold">Halo, ${currentProfile.nama_lengkap}</h2>
                        <p class="text-xs text-slate-400">Berikut informasi ringkasan finansial akun Anda.</p>
                    </div>
                    <div class="grid grid-cols-1 gap-3 text-xs">
                        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800"><p class="text-slate-400">Total Simpanan</p><p class="text-lg font-bold text-emerald-400 mt-1">Rp ${Number(totalSimpanan).toLocaleString('id-ID')}</p></div>
                        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800"><p class="text-slate-400">Total Angsuran Berjalan (Aktif)</p><p class="text-lg font-bold text-amber-400 mt-1">Rp ${totalAngsuranBerjalan.toLocaleString('id-ID')}</p></div>
                        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800"><p class="text-slate-400">Total Angsuran yang Sudah Lunas (Histori)</p><p class="text-lg font-bold text-indigo-400 mt-1">Rp ${totalAngsuranLunas.toLocaleString('id-ID')}</p></div>
                    </div>
                `;
            } else if (view === 'pinjaman') {
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-1">Ajukan Pinjaman</h2>
                    <p class="text-xs text-slate-400 mb-4">Data diri Anda sudah terlampir otomatis dari akun.</p>
                    <form onsubmit="handleAjukanPinjaman(event)" class="space-y-3 text-xs">
                        <div><label class="block font-medium mb-1">Nominal Pinjam (Rp) *</label><input type="number" id="pinjam-nominal" required placeholder="Contoh: 1000000" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div>
                            <label class="block font-medium mb-1">Jenis Tenor *</label>
                            <select id="pinjam-jenis-tenor" onchange="updateTenorOptions()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white">
                                <option value="harian">Harian</option>
                                <option value="bulanan">Bulanan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Lama Angsuran / Tenor *</label>
                            <select id="pinjam-lama-tenor" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></select>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-indigo-600 font-bold rounded-xl mt-2">Kirim Pengajuan Pinjaman</button>
                    </form>
                `;
                updateTenorOptions();
            } else if (view === 'settings') {
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-3">Pengaturan Akun Nasabah</h2>
                    <form onsubmit="updateMemberSettings(event)" class="space-y-3 text-xs max-h-[60vh] overflow-y-auto pr-1">
                        <div><label class="block font-medium mb-1">Nama Lengkap</label><input type="text" id="m-nama" value="${currentProfile.nama_lengkap || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div><label class="block font-medium mb-1">Alamat Lengkap</label><textarea id="m-alamat" required rows="2" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white">${currentProfile.alamat_lengkap || ''}</textarea></div>
                        <div><label class="block font-medium mb-1">Nomor HP/WA</label><input type="tel" id="m-hp" value="${currentProfile.no_hp || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div><label class="block font-medium mb-1">Jenis Penghasilan</label><input type="text" id="m-penghasilan" value="${currentProfile.jenis_penghasilan || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div><label class="block font-medium mb-1">Detail Usaha / Kerja</label><input type="text" id="m-detail" value="${currentProfile.detail_penghasilan || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <div><label class="block font-medium mb-1">Alamat Usaha / Kerja</label><input type="text" id="m-alamat-usaha" value="${currentProfile.alamat_usaha_kerja || ''}" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl outline-none text-white"></div>
                        <button type="submit" class="w-full py-2.5 bg-indigo-600 font-bold rounded-xl mt-2">Simpan Perubahan Data</button>
                        <button type="button" onclick="deleteMyAccount()" class="w-full py-2 bg-rose-600/20 text-rose-400 font-bold rounded-xl mt-1">Hapus Akun Saya</button>
                    </form>
                `;
            }
        }

        function updateTenorOptions() {
            const jenis = document.getElementById('pinjam-jenis-tenor').value;
            const select = document.getElementById('pinjam-lama-tenor');
            select.innerHTML = '';
            
            if (jenis === 'harian') {
                for (let i = 1; i <= 100; i++) {
                    select.innerHTML += `<option value="${i}">${i} Hari</option>`;
                }
            } else {
                for (let i = 1; i <= 30; i++) {
                    select.innerHTML += `<option value="${i}">${i} Bulan</option>`;
                }
            }
        }

        async function handleAjukanPinjaman(e) {
            e.preventDefault();
            const nominal = Number(document.getElementById('pinjam-nominal').value);
            const jenisTenor = document.getElementById('pinjam-jenis-tenor').value;
            const lamaTenor = Number(document.getElementById('pinjam-lama-tenor').value);

            // Ambil info fee koperasi
            let { data: kop } = await _supabase.from('koperasi').select('*').eq('id', currentProfile.koperasi_id).single();
            let besarFee = Number(kop?.besar_fee || 10);
            let totalFee = kop?.tipe_fee === 'persen' ? (nominal * besarFee / 100) : (besarFee * lamaTenor);
            let totalKembali = nominal + totalFee;
            let cicilanPerTempo = Math.round(totalKembali / lamaTenor);

            try {
                let { data: pinjData, error } = await _supabase.from('pinjaman').insert([{
                    koperasi_id: currentProfile.koperasi_id,
                    nasabah_id: currentUser.id,
                    nominal: nominal,
                    jenis_tenor: jenisTenor,
                    lama_tenor: lamaTenor,
                    total_angsuran_keseluruhan: totalKembali,
                    nominal_cicilan_per_tempo: cicilanPerTempo,
                    total_fee_diterima: totalFee,
                    status: 'pending',
                    total_sudah_dibayar: 0
                }]).select().single();

                if (error) throw error;

                // Buat otomatis jadwal penagihan tempo pertama di hari berikutnya/bulan depan
                let tglJatuhTempo = new Date();
                if (jenisTenor === 'harian') {
                    tglJatuhTempo.setDate(tglJatuhTempo.getDate() + 1);
                } else {
                    tglJatuhTempo.setMonth(tglJatuhTempo.getMonth() + 1);
                }

                await _supabase.from('penagihan_jatuh_tempo').insert([{
                    koperasi_id: currentProfile.koperasi_id,
                    nasabah_id: currentUser.id,
                    pinjaman_id: pinjData.id,
                    tanggal_jatuh_tempo: tglJatuhTempo.toISOString().split('T')[0],
                    total_angsuran: cicilanPerTempo,
                    status: 'belum_bayar'
                }]);

                alert('Pengajuan pinjaman berhasil dikirim dan menunggu persetujuan Admin!');
                loadMemberView('dashboard');
            } catch (err) {
                alert('Gagal mengajukan pinjaman: ' + err.message);
            }
        }

        async function approvePinjaman(id, status) {
            await _supabase.from('pinjaman').update({ status: status }).eq('id', id);
            alert(`Pinjaman berhasil di-${status}!`);
            loadOwnerView('approve');
        }

        async function updateKoperasiSettings(e) {
            e.preventDefault();
            const nama = document.getElementById('set-nama-kop').value;
            const tipeFee = document.getElementById('set-tipe-fee').value;
            const besarFee = document.getElementById('set-besar-fee').value;
            const hariLibur = document.getElementById('set-hari-libur').value;
            const denda = document.getElementById('set-denda').value;
            const logoFile = document.getElementById('set-logo').files[0];

            try {
                let logoUrl = null;
                if (logoFile) {
                    const fileName = `logo_up_${Date.now()}.${logoFile.name.split('.').pop()}`;
                    await _supabase.storage.from('koperasi-files').upload(fileName, logoFile);
                    const { data: urlData } = _supabase.storage.from('koperasi-files').getPublicUrl(fileName);
                    logoUrl = urlData.publicUrl;
                }

                let updateObj = {
                    nama_koperasi: nama,
                    tipe_fee: tipeFee,
                    besar_fee: besarFee,
                    hari_libur: hariLibur,
                    denda_keterlambatan: denda
                };
                if (logoUrl) updateObj.telepon = logoUrl; // Menyimpan URL logo

                await _supabase.from('koperasi').update(updateObj).eq('id', currentProfile.koperasi_id);
                alert('Pengaturan koperasi berhasil diperbarui!');
                loadOwnerView('settings');
            } catch (err) {
                alert('Gagal memperbarui: ' + err.message);
            }
        }

        async function updateMemberSettings(e) {
            e.preventDefault();
            try {
                await _supabase.from('profiles').update({
                    nama_lengkap: document.getElementById('m-nama').value,
                    alamat_lengkap: document.getElementById('m-alamat').value,
                    no_hp: document.getElementById('m-hp').value,
                    jenis_penghasilan: document.getElementById('m-penghasilan').value,
                    detail_penghasilan: document.getElementById('m-detail').value,
                    alamat_usaha_kerja: document.getElementById('m-alamat-usaha').value
                }).eq('id', currentUser.id);

                alert('Data pribadi berhasil diperbarui!');
                location.reload();
            } catch (err) {
                alert('Gagal: ' + err.message);
            }
        }

        async function deleteMyAccount() {
            if (confirm('Apakah Anda yakin ingin menghapus akun ini secara permanen?')) {
                await _supabase.from('profiles').delete().eq('id', currentUser.id);
                await _supabase.auth.signOut();
                alert('Akun berhasil dihapus.');
                location.reload();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            const btn = document.getElementById('btn-login-sub');

            alertBox.classList.add('hidden');
            btn.textContent = 'Memproses...';
            btn.disabled = true;

            let email = val.includes('@') ? val : `${val}@nasabah.koperasi.com`;

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email: email, password: pass });
                if (error) throw error;
                await initUserSession(data.user);
            } catch (err) {
                alertBox.textContent = 'Login Gagal: Periksa kembali NIK/Email dan Password.';
                alertBox.classList.remove('hidden');
                btn.textContent = 'Masuk';
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        async function loadKoperasiList() {
            const select = document.getElementById('reg-kop-select');
            const { data } = await _supabase.from('koperasi').select('id, nama_koperasi');
            if (data && data.length > 0) {
                select.innerHTML = '<option value="">-- Pilih Koperasi --</option>';
                data.forEach(k => { select.innerHTML += `<option value="${k.id}">${k.nama_koperasi}</option>`; });
            } else {
                select.innerHTML = '<option value="">Belum ada koperasi terdaftar</option>';
            }
        }

        async function handleRegisterOwner(e) {
            e.preventDefault();
            const nik = document.getElementById('owner-nik').value;
            if (nik.length !== 16) { alert('NIK harus 16 digit!'); return; }

            const btn = document.getElementById('btn-owner-sub');
            btn.textContent = 'Mengunggah...';
            btn.disabled = true;

            try {
                const logoFile = document.getElementById('owner-logo').files[0];
                const logoName = `logo_${nik}_${Date.now()}.${logoFile.name.split('.').pop()}`;
                await _supabase.storage.from('koperasi-files').upload(logoName, logoFile);
                const { data: urlData } = _supabase.storage.from('koperasi-files').getPublicUrl(logoName);

                const { data: kopData, error: kopErr } = await _supabase.from('koperasi').insert([{
                    nama_koperasi: document.getElementById('owner-nama-kop').value,
                    alamat: document.getElementById('owner-alamat').value,
                    telepon: urlData.publicUrl
                }]).select().single();

                if (kopErr) throw kopErr;

                const email = document.getElementById('owner-email').value;
                const pass = document.getElementById('owner-pass').value;
                const nama = document.getElementById('owner-nama').value;

                const { data: authData, error: authErr } = await _supabase.auth.signUp({
                    email: email, password: pass,
                    options: { data: { nama_lengkap: nama, role: 'owner', koperasi_id: kopData.id } }
                });

                if (authErr) throw authErr;

                if (authData.user) {
                    await _supabase.from('profiles').upsert({
                        id: authData.user.id, nama_lengkap: nama, role: 'owner', koperasi_id: kopData.id, nik: nik
                    });
                }

                alert('Pendaftaran Koperasi Berhasil! Silakan Login.');
                window.location.reload();
            } catch (err) {
                alert('Gagal: ' + err.message);
                btn.textContent = 'Daftar Koperasi';
                btn.disabled = false;
            }
        }

        async function handleRegisterNasabah(e) {
            e.preventDefault();
            const nik = document.getElementById('reg-nik').value;
            if (nik.length !== 16) { alert('NIK harus 16 digit!'); return; }

            const btn = document.getElementById('btn-reg-sub');
            btn.textContent = 'Mengunggah Data...';
            btn.disabled = true;

            try {
                const ktpFile = document.getElementById('reg-ktp').files[0];
                const diriFile = document.getElementById('reg-diri').files[0];

                const ktpName = `ktp_${nik}_${Date.now()}.${ktpFile.name.split('.').pop()}`;
                const diriName = `diri_${nik}_${Date.now()}.${diriFile.name.split('.').pop()}`;

                await _supabase.storage.from('koperasi-files').upload(ktpName, ktpFile);
                await _supabase.storage.from('koperasi-files').upload(diriName, diriFile);

                const { data: urlKtp } = _supabase.storage.from('koperasi-files').getPublicUrl(ktpName);
                const { data: urlDiri } = _supabase.storage.from('koperasi-files').getPublicUrl(diriName);

                const dummyEmail = `${nik}@nasabah.koperasi.com`;
                const pass = document.getElementById('reg-pass').value;
                const nama = document.getElementById('reg-nama').value;
                const kopId = document.getElementById('reg-kop-select').value;

                const { data: authData, error: authErr } = await _supabase.auth.signUp({
                    email: dummyEmail, password: pass,
                    options: { data: { nama_lengkap: nama, role: 'member', koperasi_id: kopId } }
                });

                if (authErr) throw authErr;

                if (authData.user) {
                    await _supabase.from('profiles').upsert({
                        id: authData.user.id,
                        nama_lengkap: nama,
                        role: 'member',
                        koperasi_id: kopId,
                        alamat_lengkap: document.getElementById('reg-alamat').value,
                        no_hp: document.getElementById('reg-hp').value,
                        nik: nik,
                        jenis_penghasilan: document.getElementById('reg-penghasilan').value,
                        detail_penghasilan: document.getElementById('reg-detail-penghasilan').value,
                        alamat_usaha_kerja: document.getElementById('reg-alamat-usaha').value,
                        foto_ktp_url: urlKtp.publicUrl,
                        foto_diri_ktp_url: urlDiri.publicUrl
                    });
                }

                alert('Pendaftaran Nasabah Berhasil! Silakan Login.');
                window.location.reload();
            } catch (err) {
                alert('Gagal: ' + err.message);
                btn.textContent = 'Daftar Nasabah';
                btn.disabled = false;
            }
        }
    </script>
